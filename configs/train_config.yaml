# DPO Training Configuration — Machine B
# All hyperparameters live here; nothing is hardcoded in src/train_dpo.py.

model:
  # Path to the base model (downloaded once with huggingface-cli)
  name_or_path: "models/qwen2.5-coder-7b"
  torch_dtype: "bfloat16"            # bf16 required for full-precision gradient training
  attn_implementation: "sdpa"

lora:
  r: 32
  lora_alpha: 64
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8     # effective batch size = 16
  learning_rate: 2.0e-6
  beta: 0.1                          # DPO temperature
  max_length: 1024
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 20
  save_strategy: "steps"
  save_steps: 20
  load_best_model_at_end: true
  warmup_ratio: 0.1
  bf16: true
  gradient_checkpointing: true
  report_to: "wandb"
  dataloader_num_workers: 4
  seed: 42

wandb:
  project: "codeq-dpo"
  entity: null                       # set to your W&B username/org if needed
